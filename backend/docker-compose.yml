version: '3'

services:
  web:
    build: .
    ports:
      - "1116:4040"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@localhost:${DB_PORT}/${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - default
      - nginx-proxy-manager_default

networks:
  nginx-proxy-manager_default:
    external: true